<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="300" fill="#ffffff" />

  <!-- Input tokens -->
  <text x="100" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Input tokens</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f172a" text-anchor="middle">
    <rect x="45" y="85" width="110" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" />
    <text x="100" y="107">"The"</text>
    <rect x="45" y="133" width="110" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" />
    <text x="100" y="155">" cat"</text>
    <rect x="45" y="181" width="110" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" />
    <text x="100" y="203">" sat"</text>
  </g>

  <line x1="175" y1="150" x2="255" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Model: matrix of weights -->
  <text x="400" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Model (matrix of weights)</text>
  <rect x="272" y="72" width="246" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <path d="M300,84 h-8 v132 h8" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M490,84 h8 v132 h-8" fill="none" stroke="#334155" stroke-width="2" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <text x="330" y="109">0.12</text><text x="378" y="109">-1.03</text><text x="426" y="109">0.57</text><text x="470" y="109">…</text>
    <text x="330" y="139">-0.88</text><text x="378" y="139">0.41</text><text x="426" y="139">2.19</text><text x="470" y="139">…</text>
    <text x="330" y="169">0.05</text><text x="378" y="169">-0.36</text><text x="426" y="169">-1.72</text><text x="470" y="169">…</text>
    <text x="330" y="199">⋮</text><text x="378" y="199">⋮</text><text x="426" y="199">⋮</text><text x="470" y="199">⋱</text>
  </g>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#64748b">(billions of numbers learned during training)</text>

  <line x1="545" y1="150" x2="625" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Output tokens -->
  <text x="705" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Next token</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f172a">
    <rect x="640" y="85" width="130" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="652" y="107">" on"</text>
    <text x="758" y="107" text-anchor="end" font-size="13" fill="#15803d">62%</text>
    <rect x="640" y="133" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="652" y="155" fill="#475569">" down"</text>
    <text x="758" y="155" text-anchor="end" font-size="13" fill="#64748b">21%</text>
    <rect x="640" y="181" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="652" y="203" fill="#475569">" still"</text>
    <text x="758" y="203" text-anchor="end" font-size="13" fill="#64748b">9%</text>
  </g>
  <text x="705" y="240" text-anchor="middle" font-size="12" fill="#64748b">…</text>
</svg>
